<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node + MySQL Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18212f;
        background: #f4f7fb;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(720px, 100%);
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 36px rgba(24, 33, 47, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
      }

      p {
        margin: 0 0 20px;
        color: #5d6b7d;
        line-height: 1.6;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        color: #ffffff;
        background: #1769e0;
        font-size: 15px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .preview {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 76px;
        margin-top: 20px;
        padding: 14px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #f8fafc;
      }

      .preview img {
        width: 48px;
        height: 48px;
      }

      .preview strong {
        display: block;
        margin-bottom: 4px;
      }

      .preview span {
        color: #5d6b7d;
        font-size: 14px;
      }

      pre {
        min-height: 180px;
        margin: 20px 0 0;
        padding: 16px;
        overflow: auto;
        color: #dce7f7;
        background: #101827;
        border-radius: 8px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>家庭菜谱接口 Demo</h1>
      <p>点击按钮，请求本地家庭和菜谱接口，并从 MySQL 表中读取数据。</p>
      <div class="actions">
        <button id="createFamilyButton" type="button">创建 Demo 家庭</button>
        <button id="uploadRecipeButton" type="button">上传 Demo 菜谱</button>
      </div>
      <div class="preview" id="familyPreview">
        <span>家庭和菜谱结果会显示在这里</span>
      </div>
      <pre id="result">等待点击...</pre>
    </main>

    <script>
      const createFamilyButton = document.querySelector('#createFamilyButton');
      const uploadRecipeButton = document.querySelector('#uploadRecipeButton');
      const familyPreview = document.querySelector('#familyPreview');
      const result = document.querySelector('#result');
      const familyCode = `DEMO_${Date.now()}`;
      const memberCode = `MEMBER_${Date.now()}`;

      function printResult(response, data) {
        result.textContent = JSON.stringify(
          {
            status: response.status,
            ok: response.ok,
            data
          },
          null,
          2
        );
      }

      createFamilyButton.addEventListener('click', async () => {
        createFamilyButton.disabled = true;
        result.textContent = '请求中...';

        try {
          const response = await fetch('/api/families', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              familyCode,
              familyName: 'Demo 家庭'
            })
          });
          const data = await response.json();
          printResult(response, data);

          if (response.ok && data.data) {
            familyPreview.innerHTML = `
              <div>
                <strong>${data.data.familyName || data.data.familyCode}</strong>
                <span>${data.data.familyCode}</span>
              </div>
            `;
          }
        } catch (error) {
          result.textContent = JSON.stringify(
            {
              error: error.message
            },
            null,
            2
          );
        } finally {
          createFamilyButton.disabled = false;
        }
      });

      uploadRecipeButton.addEventListener('click', async () => {
        uploadRecipeButton.disabled = true;
        result.textContent = '请求中...';

        try {
          const response = await fetch('/api/family-recipes/upload', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              memberCode,
              familyCode,
              recipeJson: {
                recipes: [
                  {
                    name: '番茄炒蛋'
                  }
                ]
              }
            })
          });
          const data = await response.json();
          printResult(response, data);

          if (response.ok && data.data) {
            familyPreview.innerHTML = `
              <div>
                <strong>${data.data.recipe.familyCode}</strong>
                <span>${data.data.member.memberCode} · ${data.data.recipe.recipeJson.recipes[0].name}</span>
              </div>
            `;
          }
        } catch (error) {
          result.textContent = JSON.stringify(
            {
              error: error.message
            },
            null,
            2
          );
        } finally {
          uploadRecipeButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
